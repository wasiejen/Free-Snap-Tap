name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Windows-only project (pynput selective suppression, msvcrt) - the runner
    # MUST be Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        # the chunked lane is the repo's full-suite gate (#465): one isolated
        # test process per chunk - the flat single-process run aborts natively
        # at ~85% of this suite (ABORT2 hazard, see tests/README.md). A red
        # chunk exits nonzero and fails this step; a red chunk also echoes its
        # full output into this log. conftest pins QT_QPA_PLATFORM=offscreen.
        run: python suite_lane.py

      # hard gate (F-B2): the 6 pre-existing F findings are cleared (TODO.md #2),
      # so the F gate now fails the build - do not re-add continue-on-error
      # (pinned by tests/test_ci_ruff_gate.py)
      - name: Lint (ruff F gate)
        run: python -m ruff check --select F .
