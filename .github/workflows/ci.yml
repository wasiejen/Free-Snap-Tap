name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Windows-only project (pynput selective suppression, msvcrt) - the runner
    # MUST be Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        # tests/conftest.py pins QT_QPA_PLATFORM=offscreen - no display server needed
        run: python -m pytest -q

      # informational only - baseline has 6 pre-existing ruff F findings
      # (TODO.md #2); switch to a hard check once they are fixed
      - name: Lint (informational)
        continue-on-error: true
        run: python -m ruff check --select F .
