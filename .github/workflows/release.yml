name: Release build

# Packaging unit F-B3 (estate plan 2026-11-15 / review Item 12 / ruling D2):
# a v* tag builds the Windows exe and uploads it as a build artifact.
# Build-only - no test re-run: the push/pull_request job in ci.yml already
# runs the suite on the same commit.
#
# Nuitka is the PRIMARY build path (ruling D2) but its full PySide6
# standalone + LTO + onefile compile is far too heavy for CI runner time,
# so the Nuitka build stays documented-local (README, built_nuitka.bat) and
# this job verifies the simpler PyInstaller backup path instead.
#
# The workflow never creates or pushes a tag - tagging stays the
# maintainer's action - so this runs on his next tag, changing nothing until
# then. Pinned by tests/test_ci_packaging_floor.py.

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    # Windows-only project (pynput selective suppression, msvcrt) - the
    # runner MUST be Windows, same reasoning as the test job in ci.yml.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      # Same command shape as built_pyinstaller.bat; --noconfirm keeps the
      # build non-interactive on CI. The repo .spec is gitignored, so CI
      # builds from the CLI flags like the bat does.
      - name: Build the executable with PyInstaller
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --exclude=PyQt5 --icon=./icons/keyboard.ico free_snap_tap.py

      - name: Name the executable for the tag
        shell: bash
        run: |
          cp dist/free_snap_tap.exe dist/free_snap_tap_${{ github.ref_name }}_win64.exe

      - name: Upload the executable as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: free_snap_tap_win64
          path: dist/free_snap_tap_${{ github.ref_name }}_win64.exe
